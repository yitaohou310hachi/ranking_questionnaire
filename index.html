<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>520 节点调研小问卷</title>
  <style>
    /* 1rem = 1 个 Figma 设计像素（设计稿基准宽度 390）。
       在 390px 视口下 1rem = 1px，做到像素级还原，同时随视口宽度等比缩放。 */
    html {
      font-size: calc(100vw / 390);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ===== 顶部：固定吸顶、永远位于最上层，页面纵向滚动时保持不动 ===== */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 97rem;
      overflow: hidden;
      z-index: 1000;
      pointer-events: none;
    }

    .topbar img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
    }

    /* ===== 阶段1 整体画框（含微信文章背景） ===== */
    .frame {
      position: relative;
      width: 100%;
    }

    .frame .bg {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    /* ===== 问卷封面卡片（覆盖在文章空白处） ===== */
    .cover {
      position: absolute;
      top: 1413.5rem;
      left: 21rem;
      width: 348rem;
      height: 460rem;
      background: #e8fdef;
      border-radius: 12rem;
    }

    /* 标题区 */
    .cover .title {
      position: absolute;
      top: 37rem;
      left: 50%;
      transform: translateX(-50%);
      width: 226rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6rem;
      text-align: center;
    }

    .cover .title h1 {
      font-family: "HYQiHei 80S", "PingFang SC", sans-serif;
      font-weight: 800;
      font-size: 24rem;
      line-height: normal;
      letter-spacing: 0.5rem;
      color: rgba(0, 0, 0, 0.9);
      width: 100%;
    }

    .cover .title .subtitle {
      font-weight: 500;
      font-size: 15rem;
      line-height: 20rem;
      letter-spacing: 1rem;
      color: rgba(0, 0, 0, 0.5);
      width: 100%;
    }

    .cover .title .subtitle .lead {
      letter-spacing: 4rem;
    }

    /* 阿心脚下的阴影椭圆 */
    .cover .ellipse {
      position: absolute;
      top: 287rem;
      left: 50%;
      transform: translateX(-50%);
      width: 66rem;
      height: 14rem;
    }

    /* 吉祥物「阿心」 */
    .cover .mascot {
      position: absolute;
      left: 106.01rem;
      top: 145rem;
      width: 136.547rem;
      height: 136.547rem;
    }

    .cover .mascot .mascot-body {
      position: absolute;
      left: 1.54rem;
      top: 3.54rem;
      width: 138.247rem;
      height: 130.893rem;
      transform: rotate(2.11deg);
    }

    .cover .mascot .mascot-detail {
      position: absolute;
      left: 57.29rem;
      top: 39.27rem;
      width: 24.658rem;
      height: 27.765rem;
      transform: scaleY(-1) rotate(-170.51deg);
    }

    /* 周围装饰小色块 */
    .cover .v {
      position: absolute;
    }

    .cover .v1 {
      top: 223rem;
      left: 81.99rem;
      width: 36.19rem;
      height: 35.539rem;
      transform: scaleX(-1) rotate(-40.17deg);
    }

    .cover .v2 {
      top: 259rem;
      left: 122.98rem;
      width: 22.72rem;
      height: 20.159rem;
      transform: scaleX(-1) rotate(-15.47deg);
    }

    .cover .v3 {
      top: 138rem;
      left: 225.99rem;
      width: 28.88rem;
      height: 26.887rem;
      transform: scaleX(-1) rotate(26.21deg);
    }

    /* 开始回答按钮 */
    .cover .start-btn {
      position: absolute;
      bottom: 68rem;
      left: 50%;
      transform: translateX(-50%);
      width: 207rem;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12rem 24rem;
      border: none;
      border-radius: 86rem;
      background-image: linear-gradient(212.02deg, #67e682 10.97%, #2bd97e 59.57%);
      font-family: "HYQiHei 80S", "PingFang SC", sans-serif;
      font-weight: 800;
      font-size: 17rem;
      letter-spacing: 0.25rem;
      color: #ffffff;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 6rem 14rem rgba(43, 217, 126, 0.32);
      transition: transform 0.08s ease, box-shadow 0.15s ease;
    }

    .cover .start-btn:active {
      transform: translateX(-50%) scale(0.96);
      box-shadow: 0 3rem 8rem rgba(43, 217, 126, 0.3);
    }

    /* 底部礼物提示 */
    .cover .gift {
      position: absolute;
      bottom: 32rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 4rem;
      white-space: nowrap;
    }

    .cover .gift .gift-icon {
      width: 16rem;
      height: 16rem;
    }

    .cover .gift span {
      font-weight: 500;
      font-size: 14rem;
      letter-spacing: 0.5rem;
      color: #b59d70;
    }
  </style>
</head>
<body>
  <header class="topbar" aria-label="顶部">
    <img src="images/top.png" alt="">
  </header>

  <div class="frame">
    <img class="bg" src="images/background.png" alt="微信营销 520 节点优秀案例精选">

    <section class="cover" aria-label="520 节点调研小问卷">
      <div class="title">
        <h1>520 节点调研小问卷</h1>
        <p class="subtitle"><span class="lead">花1</span>分钟，和阿心聊一聊</p>
      </div>

      <img class="ellipse" src="images/ellipse.svg" alt="">

      <div class="mascot">
        <img class="mascot-body" src="images/mascot-body.svg" alt="">
        <img class="mascot-detail" src="images/mascot-detail.svg" alt="">
      </div>

      <img class="v v1" src="images/vector1.svg" alt="">
      <img class="v v2" src="images/vector2.svg" alt="">
      <img class="v v3" src="images/vector3.svg" alt="">

      <button class="start-btn" type="button" id="startBtn">开始回答</button>

      <div class="gift">
        <img class="gift-icon" src="images/gift.svg" alt="">
        <span>完成问卷可获一份专属礼物</span>
      </div>
    </section>
  </div>

  <script>
    document.getElementById('startBtn').addEventListener('click', function () {
      console.log('开始回答问卷');
    });
  </script>
</body>
</html>
